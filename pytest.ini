[pytest]
# Watchdog contra travamento: se um teste passar de 60 s, o pytest dumpa a
# pilha de TODAS as threads e encerra o processo, em vez de ficar pendurado
# para sempre sem dizer onde. O teste mais lento da suíte hoje leva ~8 s
# (os de WebEngine, que esperam um QEventLoop com teto de segurança), então
# 60 s é folga larga — quem estourar isso está travado, não lento.
#
# Isso é o que faltava quando um QTimer órfão do Qt disparava dentro do
# update() do Tcl/Tk e abria um modal: a suíte parava em ~65 % sem
# diagnóstico nenhum. Ver a fixture _sem_timers_orfaos em tests/conftest.py.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true
